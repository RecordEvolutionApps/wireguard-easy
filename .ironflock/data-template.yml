# yaml-language-server: $schema=https://ironflock.com/schemas/data-template/v1.yml
############################################################
# Data template of the WireGuard VPN app (wg-easy on IronFlock)
# Design: design/entities.md and design/architecture.md (keep them in step).
#
# Each gateway writes its own rows from the companion process
# (register_device.py). The board writes gateway_settings (what users decide
# per gateway) and, as the only exception to one writer per table, the
# deleted flag of a gateway or a client that is gone. Clients, keys and the
# other VPN settings live in wg-easy and are changed in its Web UI.
############################################################
data:
  description: >-
    WireGuard VPN gateways (wg-easy) running on edge devices. Entities and their
    keys: a gateway is the IronFlock device itself (device_id, the device's key);
    its settings are keyed by device_id; a VPN client is keyed by client_key,
    "<device_id>-<client_id>", since wg-easy numbers clients per gateway; a
    check by device_id and check_id. Traffic samples and events carry the
    device_id and, when about a client, its client_key. Direction naming
    follows the gateway: rx = received from a client, tx = sent to a client.
  tables:
    - tablename: gateways
      description: >-
        Entity table, one entity per gateway (device_id): its current state.
        Written by the gateway itself (register_device.py): at start a
        registration row with device_id, device_name, web_url and deleted =
        false, then a row with the columns that changed, at most every 30 s.
        The board's "Remove gateway" form writes deleted = true for a gateway
        that is gone; nothing removes a gateway automatically, and one that
        starts the app again reappears. Read it with the latest filter and
        deleted not true. status is OK, WARNING, PROBLEM, SETUP_PENDING or
        STARTING and summarizes the checks table.
      chunkTimeInterval: 1 month
      maintainLatestFlagFor: [device_id]
      columnstore: false
      columns:
        - id: tsp
          name: Timestamp
          description: When this state was observed.
          dataType: timestamp
        - id: device_id
          name: Gateway id
          description: The gateway's IronFlock device key, written by the gateway; the entity key and the route segment of its pages.
          dataType: numeric
        - id: device_name
          name: Gateway
          description: Name of the gateway device in IronFlock, written by the gateway at start.
          dataType: string
        - id: deleted
          name: Removed
          description: True once a user removed the gateway on the board; the gateway's next start writes false again.
          dataType: boolean
        - id: status
          name: Status
          description: "Overall state: OK (all checks pass), WARNING (something to look at, VPN works), PROBLEM (VPN does not work as it should), SETUP_PENDING (first-boot setup not finished), STARTING (database not created yet)."
          dataType: string
        - id: status_detail
          name: Status detail
          description: Short reason for the status, e.g. the failing checks or the connected client count.
          dataType: string
        - id: web_url
          name: Web UI URL
          description: HTTPS remote-access URL of the wg-easy admin Web UI (port 51821), from getRemoteAccessUrlForPort; a development run writes its own -dev tunnel URL.
          dataType: string
        - id: vpn_endpoint
          name: VPN endpoint
          description: "Public endpoint clients connect to, host:port, as the tunnel currently assigns it. Empty while the VPN tunnel is inactive."
          dataType: string
        - id: vpn_host
          name: VPN host
          description: Host part of the VPN endpoint (the tunnel domain).
          dataType: string
        - id: vpn_port
          name: VPN public port
          description: Public UDP port the tunnel forwards to WireGuard's ListenPort 51820 in the container.
          dataType: numeric
        - id: tunnel_active
          name: Tunnel active
          description: True when the device has a public UDP port assigned for the VPN; false means no client can connect.
          dataType: boolean
        - id: interface_up
          name: Interface up
          description: True when the WireGuard interface (wg0) exists in the kernel.
          dataType: boolean
        - id: listen_port
          name: ListenPort
          description: UDP port WireGuard listens on inside the container; must be 51820, the port the tunnel forwards to.
          dataType: numeric
        - id: setup_done
          name: Setup done
          description: True once wg-easy's first-boot setup created the admin account.
          dataType: boolean
        - id: db_persisted
          name: Database persisted
          description: True when /etc/wireguard is linked to the persistent /data volume, so clients survive restarts.
          dataType: boolean
        - id: ip_forward
          name: IP forwarding
          description: True when net.ipv4.ip_forward is enabled; without it clients connect but reach nothing.
          dataType: boolean
        - id: nat_masquerade
          name: NAT masquerade
          description: True when the MASQUERADE rule for the VPN subnet is installed; null when iptables could not be queried.
          dataType: boolean
        - id: wg_easy_version
          name: wg-easy version
          description: Version of the bundled upstream wg-easy server.
          dataType: string
        - id: ipv4_cidr
          name: VPN subnet
          description: IPv4 subnet of the VPN (default 10.8.0.0/24); clients get addresses from it.
          dataType: string
        - id: lan_device
          name: LAN interface
          description: Network interface of the gateway that VPN traffic is masqueraded to (default eth0).
          dataType: string
        - id: mtu
          name: MTU
          description: MTU of the WireGuard interface (default 1420).
          dataType: numeric
        - id: default_allowed_ips
          name: Default Allowed IPs
          description: Comma-separated Allowed IPs new clients get (the routes a client sends through the VPN), as in force in wg-easy. 0.0.0.0/0 means full tunnel. Set on the board's gateway settings or in the Web UI.
          dataType: string
        - id: default_dns
          name: Default DNS
          description: Comma-separated DNS servers handed to new clients.
          dataType: string
        - id: clients_total
          name: Clients
          description: Number of configured clients.
          dataType: numeric
        - id: clients_enabled
          name: Enabled clients
          description: Number of enabled clients.
          dataType: numeric
        - id: clients_connected
          name: Connected clients
          description: Number of clients with a handshake in the last 3 minutes.
          dataType: numeric

    - tablename: gateway_settings
      description: >-
        Entity table, one entity per gateway (device_id): what users decide for
        the gateway. Written by the board's settings form on the gateway's
        Settings page. The gateway named by device_id follows the table
        (subscribe, then the newest row) and applies a row newer than the one
        it applied last; the result shows in gateways.default_allowed_ips and as
        an allowed_ips_applied or settings_rejected event.
      chunkTimeInterval: 1 year
      maintainLatestFlagFor: [device_id]
      columnstore: false
      columns:
        - id: tsp
          name: Saved
          description: When the settings were saved.
          dataType: timestamp
        - id: device_id
          name: Gateway id
          description: The gateway these settings are for (gateways.device_id).
          dataType: numeric
        - id: default_allowed_ips
          name: Default Allowed IPs
          description: Comma-separated Allowed IPs that newly created clients get, e.g. "10.8.0.0/24, 192.168.0.10/32" (split tunnel) or "0.0.0.0/0, ::/0" (full tunnel). Existing clients keep their own.
          dataType: string

    - tablename: clients
      description: >-
        Entity table, one entity per VPN client (client_key,
        "<device_id>-<client_id>"), with its configuration from wg-easy and its
        live connection state. Written by the gateway that has the client: the
        first row per run of the app with deleted = false, then a row with the
        columns that changed when the client is created, changed, connects or
        disconnects, and at least every 10 minutes while connected; deleted =
        true and status REMOVED once it was deleted in the Web UI. The board's
        "Remove from list" form writes deleted = true for a client whose
        gateway is gone. Read it with the latest filter and deleted not true.
      chunkTimeInterval: 1 month
      maintainLatestFlagFor: [client_key]
      columnstore: false
      columns:
        - id: tsp
          name: Timestamp
          description: When this client state was observed.
          dataType: timestamp
        - id: client_key
          name: Client key
          description: '"<device_id>-<client_id>": identifies the client across all gateways; the entity key and the route segment of its page.'
          dataType: string
        - id: device_id
          name: Gateway id
          description: The gateway the client is configured on (gateways.device_id).
          dataType: numeric
        - id: device_name
          name: Gateway
          description: Name of that gateway, written by the gateway.
          dataType: string
        - id: client_id
          name: Client id
          description: wg-easy's id of the client on its gateway.
          dataType: numeric
        - id: name
          name: Client
          description: Client name as given in the Web UI.
          dataType: string
        - id: display_name
          name: Client and gateway
          description: '"<name> · <gateway>", the label of the client in lists across gateways.'
          dataType: string
        - id: status
          name: Status
          description: "CONNECTED (handshake within 3 min), OFFLINE (connected before, no recent handshake), NEVER_CONNECTED (no handshake since the interface came up), DISABLED, EXPIRED or REMOVED."
          dataType: string
        - id: enabled
          name: Enabled
          description: False when the client is switched off in the Web UI.
          dataType: boolean
        - id: connected
          name: Connected
          description: True when the last handshake is at most 3 minutes old.
          dataType: boolean
        - id: ipv4
          name: VPN IPv4
          description: The client's address inside the VPN subnet.
          dataType: string
        - id: ipv6
          name: VPN IPv6
          description: The client's IPv6 address inside the VPN (unused when IPv6 is disabled).
          dataType: string
        - id: allowed_ips
          name: Allowed IPs
          description: Comma-separated destinations the client routes through the VPN (the AllowedIPs line of its config). 0.0.0.0/0 is a full tunnel; a split tunnel lists the VPN subnet plus machine addresses.
          dataType: string
        - id: uses_default_allowed_ips
          name: Uses default Allowed IPs
          description: True when the client has no Allowed IPs of its own and follows the gateway's default.
          dataType: boolean
        - id: expires_at
          name: Expires
          description: Expiry date set in the Web UI; empty when the client does not expire.
          dataType: timestamp
        - id: last_handshake
          name: Last handshake
          description: Time of the last WireGuard handshake with this client; empty if none since the interface came up.
          dataType: timestamp
        - id: rx_bytes
          name: Received bytes
          description: Bytes the gateway received from the client since the interface came up (the client's upload).
          dataType: bigint
        - id: tx_bytes
          name: Sent bytes
          description: Bytes the gateway sent to the client since the interface came up (the client's download).
          dataType: bigint
        - id: public_key
          name: Public key
          description: The client's WireGuard public key, as shown by wg show.
          dataType: string
        - id: deleted
          name: Removed
          description: True once the client was deleted in the Web UI, or removed from the lists on the board; filter these out in lists.
          dataType: boolean

    - tablename: checks
      description: >-
        Entity table, one entity per check per gateway (device_id, check_id):
        the gateway's setup checklist, written by the gateway when a check's
        result changes. Checks are ordered as a setup walk-through; each one
        assumes the ones before it pass. Read it with the latest filter. result
        is OK, INFO, WARNING or PROBLEM; hint says how to fix it.
      chunkTimeInterval: 1 month
      maintainLatestFlagFor: [device_id, check_id]
      columnstore: false
      columns:
        - id: tsp
          name: Timestamp
          description: When this result was observed.
          dataType: timestamp
        - id: device_id
          name: Gateway id
          description: The gateway the check ran on (gateways.device_id).
          dataType: numeric
        - id: check_id
          name: Check id
          description: "Stable id of the check: db_persisted, database, setup_done, interface_up, listen_port, tunnel_active, endpoint_synced, ip_forward, nat_masquerade, web_ui, default_allowed_ips, clients, expired_clients, never_connected."
          dataType: string
        - id: label
          name: Check
          description: Human-readable name of the check.
          dataType: string
        - id: result
          name: Result
          description: "OK, INFO (nothing to do), WARNING (works, but look at it) or PROBLEM (the VPN does not work as it should)."
          dataType: string
        - id: message
          name: Message
          description: What was observed.
          dataType: string
        - id: hint
          name: How to fix
          description: What to do when the result is not OK; empty otherwise.
          dataType: string

    - tablename: traffic
      description: >-
        Readings: transfer rates per VPN client, sampled by the gateway every
        minute and written only for clients whose counters moved (idle clients
        produce no rows). Counters are cumulative since the interface came up
        and reset on restart; the rates are per sample interval. Charts pivot
        by client_name and filter by device_id or client_key.
      chunkTimeInterval: 7 days
      dropAfter: 90 days
      downsample:
        bucket: 1 minute
        keepFor: 1 year
      columns:
        - id: tsp
          name: Timestamp
          description: End of the sample interval.
          dataType: timestamp
        - id: device_id
          name: Gateway id
          description: The gateway that took the sample (gateways.device_id).
          dataType: numeric
        - id: device_name
          name: Gateway
          description: Name of the gateway device in IronFlock.
          path: kwargs.DEVICE_NAME
          dataType: string
        - id: client_key
          name: Client key
          description: The client (clients.client_key).
          dataType: string
        - id: client_id
          name: Client id
          description: wg-easy's id of the client on this gateway.
          dataType: numeric
        - id: client_name
          name: Client
          description: Client name at the time of the sample.
          dataType: string
        - id: rx_kbs
          name: From client
          description: Kilobytes per second the gateway received from the client during the interval (the client's upload).
          dataType: numeric
        - id: tx_kbs
          name: To client
          description: Kilobytes per second the gateway sent to the client during the interval (the client's download).
          dataType: numeric
        - id: rx_bytes
          name: Received bytes
          description: Cumulative bytes received from the client since the interface came up.
          dataType: bigint
        - id: tx_bytes
          name: Sent bytes
          description: Cumulative bytes sent to the client since the interface came up.
          dataType: bigint

    - tablename: events
      description: >-
        Events: what the app did and observed on each gateway, appended by the
        gateway: companion startup, client Endpoint changes after a tunnel
        change, default Allowed IPs applied from the board's settings or
        rejected, ListenPort repaired, status changes, clients created,
        removed, connected and disconnected. Read it newest first to explain
        why something changed.
      chunkTimeInterval: 1 month
      dropAfter: 180 days
      columns:
        - id: tsp
          name: Timestamp
          description: When the event happened.
          dataType: timestamp
        - id: device_id
          name: Gateway id
          description: The gateway the event happened on (gateways.device_id).
          dataType: numeric
        - id: device_name
          name: Gateway
          description: Name of the gateway device in IronFlock.
          path: kwargs.DEVICE_NAME
          dataType: string
        - id: client_key
          name: Client key
          description: The client the event is about (clients.client_key); empty for gateway events.
          dataType: string
        - id: level
          name: Level
          description: info, warning or error.
          dataType: string
        - id: kind
          name: Kind
          description: "Machine-readable kind: startup, endpoint_changed, allowed_ips_applied, settings_rejected, listen_port_repaired, status_changed, client_added, client_removed, client_changed, client_connected, client_disconnected."
          dataType: string
        - id: message
          name: Message
          description: Human-readable description of the event.
          dataType: string
        - id: detail
          name: Detail
          description: Structured details of the event (e.g. the new endpoint, the client id).
          dataType: json

  transforms:
    - tablename: fleet_summary
      description: >-
        One row with fleet-wide counts over the current state of every gateway
        that is not removed: how many gateways report, how many are OK or need
        attention, and how many clients are connected and enabled across all of
        them. Feeds the figures on the board's home page. The gateways refresh
        it after writing their state and when a gateway is removed; the
        schedule is a one-minute backstop.
      materialize: false
      schedule: "0 * * * * *"
      sql: >-
        WITH current AS (
          SELECT DISTINCT ON (device_id) status, clients_connected, clients_enabled, deleted
          FROM gateways
          WHERE device_id IS NOT NULL
          ORDER BY device_id, tsp DESC
        )
        SELECT now() AS tsp,
               count(*) AS gateways,
               count(*) FILTER (WHERE status = 'OK') AS gateways_ok,
               count(*) FILTER (WHERE status IS DISTINCT FROM 'OK') AS gateways_attention,
               coalesce(sum(clients_connected), 0)::bigint AS clients_connected,
               coalesce(sum(clients_enabled), 0)::bigint AS clients_enabled
        FROM current
        WHERE deleted IS NOT TRUE
      columns:
        - id: tsp
          name: Computed at
          description: When the summary was computed.
          dataType: timestamp
        - id: gateways
          name: Gateways
          description: Number of gateways that have reported and are not removed.
          dataType: bigint
        - id: gateways_ok
          name: Gateways OK
          description: Gateways whose current status is OK.
          dataType: bigint
        - id: gateways_attention
          name: Gateways needing attention
          description: Gateways whose current status is WARNING, PROBLEM, SETUP_PENDING or STARTING.
          dataType: bigint
        - id: clients_connected
          name: Connected clients
          description: Sum of connected clients over all gateways.
          dataType: bigint
        - id: clients_enabled
          name: Enabled clients
          description: Sum of enabled clients over all gateways.
          dataType: bigint
