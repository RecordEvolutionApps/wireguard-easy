# yaml-language-server: $schema=https://ironflock.com/schemas/env-template/v1.yml
############################################################
# Parameters of the WireGuard VPN app (wg-easy v15 on IronFlock)
#
# Shown as a form in the device or group settings; values reach the container
# as environment variables.
#
# This app is based on wg-easy v15. On the FIRST start (empty database) the
# admin account is created from INIT_USERNAME / INIT_PASSWORD, so the setup
# wizard is skipped and you can log straight into the Web UI.
#
# IMPORTANT: wg-easy applies INIT_* values only on the very first start;
# changing them later has no effect. Afterwards the Web UI holds them, and the
# default Allowed IPs for new clients is set per gateway on the board (its
# Settings page, table gateway_settings): it changes while the app runs, so it
# is board-written state, not a parameter. See design/decisions.md.
#
# The VPN host/port (INIT_HOST / INIT_PORT) and INIT_ENABLED are derived from
# the device and set in entrypoint.sh; the client Endpoint then follows the
# IronFlock tunnel automatically. Docs:
# https://wg-easy.github.io/wg-easy/latest/advanced/config/unattended-setup/
############################################################

INIT_USERNAME:
    label: Admin Username
    type: text
    defaultValue: admin
    description: Initial admin username for the Web UI (min. 2 characters). Only applied on the first start.

INIT_PASSWORD:
    label: Admin Password
    type: text
    secret: true
    defaultValue: wireguard1234
    description: Initial admin password. MUST be at least 12 characters or the first login fails. Change it in the Web UI right after the first login. Only applied on the first start.

INIT_DNS:
    label: DNS Server clients will use
    type: text
    defaultValue: 1.1.1.1
    description: Comma-separated DNS server(s) handed to clients. Only applied on the first start; change it later under Admin Panel > Interface in the Web UI.

INIT_ALLOWED_IPS:
    label: Allowed IPs clients will use
    type: text
    defaultValue: 0.0.0.0/0, ::/0
    description: Comma-separated Allowed IPs that new clients get, applied on the first start only. Afterwards change the default on the board (the gateway's Settings page), which affects newly created clients only. Keep the default for a full tunnel (ALL laptop traffic goes through the gateway). For a split tunnel, reach machines behind the gateway while browsing the internet normally, set "10.8.0.0/24, <machine subnet>", e.g. "10.8.0.0/24, 192.168.0.0/24".

INIT_IPV4_CIDR:
    label: VPN IPv4 subnet
    type: text
    defaultValue: 10.8.0.0/24
    description: Subnet the VPN uses for the gateway and its clients, in CIDR notation. Change it only when your office or plant network already uses 10.8.0.x. Only applied on the first start, together with the IPv6 subnet.

INIT_IPV6_CIDR:
    label: VPN IPv6 subnet
    type: text
    defaultValue: fdcc:ad94:bacf:61a4::cafe:0/112
    description: IPv6 subnet of the VPN. Unused while IPv6 is disabled; keep the default. Only applied on the first start, together with the IPv4 subnet.

DISABLE_IPV6:
    label: Disable IPv6
    type: boolean
    defaultValue: true
    description: Disable IPv6 support on the server (recommended unless your plant network routes IPv6). Applied on every start.

# Runtime setting (applied on every start, not just the first one).
INSECURE:
    label: Allow insecure HTTP access
    type: boolean
    defaultValue: false
    description: Keep this OFF when using the HTTPS app URL (the IronFlock tunnel provides TLS). Turn ON only to allow login over plain HTTP, e.g. direct LAN access without the tunnel — the session cookie is then no longer HTTPS-only, so use it only on trusted networks.
