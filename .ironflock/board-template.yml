# yaml-language-server: $schema=https://ironflock.com/schemas/board-template/v1.yml
# Board of the WireGuard VPN app, bound to the tables in data-template.yml.
# Design: design/board.md (keep both in step).
# Viewers: the engineers and IT people who run the gateways, at a desk or laptop.
# Look: that of the wg-easy Web UI the board embeds (light grey page, white
# panels with a shadow, wg-easy red #991b1b on buttons only).
# /                           does every gateway's VPN work, and who is connected? fleet
#                             figures, gateway states, clients connected now, latest events
# /gateway                    Gateways: the list and the overview table
# /gateway/<device_id>        Gateway: state card and the embedded wg-easy Web UI
#   .../clients               its clients, each opening its client page
#   .../traffic               traffic per client, last 24 hours
#   .../checks                the setup checklist with hints
#   .../events                what the app did and observed
#   .../settings              default Allowed IPs form, saved settings, "Remove gateway"
# /client                     Client stats: all clients on all gateways, read-only (clients
#                             are created, changed and deleted in the gateway's Web UI)
# /client/<client_key>        Client: a button to its gateway, state card, traffic, events
# /guide                      setup, split tunnel, troubleshooting
# Route segments: gateway and client '2'.
# States: ok #16a34a, warning #d97706, alarm #dc2626, idle #6b7280, the same on
# every widget (design/board.md maps each status to one of them).
# The board editor in IronFlock rewrites this file on save.
name: WireGuard_Easy
widgets:
- layout_id: nav
  package_name: widget-navbar
  version: 1.0.27
  chartconfig:
    title: $str:WireGuard VPN
    route: $str:/
    style: {fontSize: '$num:16', fontWeight: '$num:400'}
    navItems:
    - {label: '$str:Gateways', iconName: '$str:router', route: '$str:/gateway/'}
    - {label: '$str:Client stats', iconName: '$str:laptop', route: '$str:/client/'}
    - {label: '$str:Guide', iconName: '$str:menu_book', route: '$str:/guide'}
  custom_style: {tile_border_color: transparent}
- layout_id: errors
  package_name: widget-toast
  version: 1.0.12
  chartconfig:
    message:
      valueRef:
        tablename: error-logs
        column: user_message
        queryParams:
          limit: 1
          filterAnd:
          - {column: source, operator: '=', value: app, dataType: string}
    type:
      valueRef:
        tablename: error-logs
        column: level
        queryParams:
          limit: 1
          filterAnd:
          - {column: source, operator: '=', value: app, dataType: string}
    position: $str:bottom-right
    successColor: $str:#16a34a
    errorColor: $str:#dc2626
    infoColor: $str:#6b7280
    warningColor: $str:#d97706
  custom_style: {tile_border_color: transparent, tile_background_color: transparent}
- layout_id: home-fleet
  package_name: widget-markdown
  version: 1.1.1
  chartconfig:
    markdown: |
      <style>.kpi{display:flex;flex-direction:column;justify-content:space-between;height:96cqh}.kpi .row{display:flex;gap:24px}.kpi .v{font-size:22cqh;font-weight:700;line-height:1}.kpi .l{opacity:.7}.kpi .c{opacity:.7;font-size:13px}</style>
      <div class="kpi">
      <div class="l">Gateways</div>
      <div class="row"><div><div class="v">{{ok}}</div><div class="l">OK</div></div><div><div class="v">{{attention}}</div><div class="l">need attention</div></div><div><div class="v">{{gateways}}</div><div class="l">reporting</div></div></div>
      <div class="l">VPN clients</div>
      <div class="row"><div><div class="v">{{connected}}</div><div class="l">connected now</div></div><div><div class="v">{{enabled}}</div><div class="l">enabled</div></div></div>
      <div class="c">as of {{asof}}</div>
      </div>
    data:
    - label: $str:ok
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: fleet_summary
          column: gateways_ok
          queryParams: {limit: 1}
    - label: $str:attention
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: fleet_summary
          column: gateways_attention
          queryParams: {limit: 1}
    - label: $str:gateways
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: fleet_summary
          column: gateways
          queryParams: {limit: 1}
    - label: $str:connected
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: fleet_summary
          column: clients_connected
          queryParams: {limit: 1}
    - label: $str:enabled
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: fleet_summary
          column: clients_enabled
          queryParams: {limit: 1}
    - label: $str:asof
      valueType: $str:timestamp
      value:
        valueRef:
          tablename: fleet_summary
          column: tsp
          queryParams: {limit: 1}
- layout_id: home-gateways
  package_name: widget-table
  version: 1.3.3
  chartconfig:
    title: $str:Gateways
    subTitle: $str:Current state of every gateway; open one under Gateways
    columns:
    - header: $str:Gateway
      type: $str:string
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: device_name}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      sortDirection: asc
      styling: {fontWeight: '$str:600'}
    - header: $str:Status
      type: $str:state
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: status}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling:
        stateMap: $str:'OK', '#16a34a', 'WARNING', '#d97706', 'SETUP_PENDING', '#d97706', 'PROBLEM', '#dc2626', 'STARTING', '#6b7280'
        width: $str:130px
    - header: $str:Detail
      type: $str:string
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: status_detail}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
    - header: $str:Connected
      type: $str:number
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: clients_connected}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling: {precision: '$num:0', width: '$str:100px'}
    - header: $str:Updated
      type: $str:timestamp
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: tsp}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling: {timestampFormat: '$str:yyyy-MM-dd HH:mm', width: '$str:140px'}
    styling: {headerFontSize: '$str:14px', cellPaddingVertical: '$str:4px', cellPaddingHorizontal: '$str:8px'}
- layout_id: home-connected
  package_name: widget-table
  version: 1.3.3
  chartconfig:
    title: $str:Connected now
    subTitle: $str:Clients with a handshake in the last 3 minutes, on all gateways
    columns:
    - header: $str:Client
      type: $str:string
      values:
        tableRef:
          tablename: vpn_clients
          format: {value: name}
          queryParams:
            limit: 500
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
            - {column: status, operator: '=', value: CONNECTED, dataType: string}
      sortDirection: asc
      styling: {fontWeight: '$str:600'}
    - header: $str:Gateway
      type: $str:string
      values:
        tableRef:
          tablename: vpn_clients
          format: {value: device_name}
          queryParams:
            limit: 500
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
            - {column: status, operator: '=', value: CONNECTED, dataType: string}
    - header: $str:VPN address
      type: $str:string
      values:
        tableRef:
          tablename: vpn_clients
          format: {value: ipv4}
          queryParams:
            limit: 500
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
            - {column: status, operator: '=', value: CONNECTED, dataType: string}
      styling: {width: '$str:120px'}
    - header: $str:Last handshake
      type: $str:timestamp
      values:
        tableRef:
          tablename: vpn_clients
          format: {value: last_handshake}
          queryParams:
            limit: 500
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
            - {column: status, operator: '=', value: CONNECTED, dataType: string}
      styling: {timestampFormat: '$str:yyyy-MM-dd HH:mm', width: '$str:140px'}
    styling: {headerFontSize: '$str:14px', cellPaddingVertical: '$str:4px', cellPaddingHorizontal: '$str:8px'}
- layout_id: home-events
  package_name: widget-table
  version: 1.3.3
  chartconfig:
    title: $str:Latest events
    subTitle: $str:What the app did and observed, newest first
    columns:
    - header: $str:Time
      type: $str:timestamp
      values:
        tableRef:
          tablename: events
          format: {value: tsp}
          queryParams: {limit: 50}
      sortDirection: desc
      styling: {timestampFormat: '$str:yyyy-MM-dd HH:mm', width: '$str:140px'}
    - header: $str:Gateway
      type: $str:string
      values:
        tableRef:
          tablename: events
          format: {value: device_name}
          queryParams: {limit: 50}
      styling: {width: '$str:140px'}
    - header: $str:Level
      type: $str:state
      values:
        tableRef:
          tablename: events
          format: {value: level}
          queryParams: {limit: 50}
      styling: {stateMap: '$str:''info'', ''#6b7280'', ''warning'', ''#d97706'', ''error'', ''#dc2626''', width: '$str:90px'}
    - header: $str:Message
      type: $str:string
      values:
        tableRef:
          tablename: events
          format: {value: message}
          queryParams: {limit: 50}
    styling: {headerFontSize: '$str:14px', cellPaddingVertical: '$str:4px', cellPaddingHorizontal: '$str:8px'}
- layout_id: gateway-list
  package_name: widget-sidenav
  version: 1.0.27
  chartconfig:
    title: $str:Gateways
    route: $str:/gateway/
    navItems:
      tableRef:
        tablename: gateway_registry
        format:
          label: device_name
          iconName: $str:router
          route: $str:/gateway/{{gateway}}
          variables:
          - {label: '$str:gateway', value: device_id}
        queryParams:
          limit: 500
          filterAnd:
          - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
          - combinator: OR
            filters:
            - {column: deleted, operator: IS NULL, dataType: boolean}
            - {column: deleted, operator: '=', value: false, dataType: boolean}
- layout_id: gateway-table
  package_name: widget-table
  version: 1.3.3
  chartconfig:
    title: $str:Gateways
    subTitle: $str:Current state of every gateway running the app
    columns:
    - header: $str:Gateway
      type: $str:string
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: device_name}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      sortDirection: asc
      styling: {fontWeight: '$str:600'}
    - header: $str:Status
      type: $str:state
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: status}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling:
        stateMap: $str:'OK', '#16a34a', 'WARNING', '#d97706', 'SETUP_PENDING', '#d97706', 'PROBLEM', '#dc2626', 'STARTING', '#6b7280'
        width: $str:130px
    - header: $str:Detail
      type: $str:string
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: status_detail}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
    - header: $str:VPN endpoint
      type: $str:string
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: vpn_endpoint}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
    - header: $str:Connected
      type: $str:number
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: clients_connected}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling: {precision: '$num:0', width: '$str:100px'}
    - header: $str:Clients
      type: $str:number
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: clients_total}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling: {precision: '$num:0', width: '$str:80px'}
    - header: $str:Updated
      type: $str:timestamp
      values:
        tableRef:
          tablename: gateway_registry
          format: {value: tsp}
          queryParams:
            limit: 200
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - combinator: OR
              filters:
              - {column: deleted, operator: IS NULL, dataType: boolean}
              - {column: deleted, operator: '=', value: false, dataType: boolean}
      styling: {timestampFormat: '$str:yyyy-MM-dd HH:mm', width: '$str:140px'}
    styling: {headerFontSize: '$str:14px', cellPaddingVertical: '$str:4px', cellPaddingHorizontal: '$str:8px'}
- layout_id: gateways-hint
  package_name: widget-markdown
  version: 1.1.1
  chartconfig:
    markdown: |
      ## Gateways

      Pick a gateway on the left. Its page embeds the wg-easy admin Web UI, where you create clients and download their configs. Its tabs show the gateway's **Clients**, **Traffic**, setup **Checks**, **Events** and **Settings**.

      The **VPN endpoint** is what clients connect to. It follows the IronFlock tunnel by itself; when it changes (see Events), clients must download their configs again.

      Every device that runs the app adds itself to this list, and **Updated** shows when it last reported. A gateway that is gone for good stays here until you remove it on its **Settings** tab.
    data: []
    verticalScroll: $bool:true
- layout_id: gateway-tabs
  package_name: widget-navbar
  version: 1.0.27
  chartconfig:
    title:
      valueRef:
        tablename: gateway_registry
        column: device_name
        queryParams:
          limit: 1
          filterAnd:
          - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
          - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    route: $str:/gateway/*
    style: {fontSize: '$num:15', fontWeight: '$num:400'}
    navItems:
    - {label: '$str:Overview', iconName: '$str:dashboard', route: '$str:/gateway/*'}
    - {label: '$str:Clients', iconName: '$str:laptop', route: '$str:/gateway/*/clients'}
    - {label: '$str:Traffic', iconName: '$str:swap_vert', route: '$str:/gateway/*/traffic'}
    - {label: '$str:Checks', iconName: '$str:checklist', route: '$str:/gateway/*/checks'}
    - {label: '$str:Events', iconName: '$str:history', route: '$str:/gateway/*/events'}
    - {label: '$str:Settings', iconName: '$str:tune', route: '$str:/gateway/*/settings'}
  custom_style: {tile_border_color: transparent}
- layout_id: gateway-card
  package_name: widget-markdown
  version: 1.1.1
  chartconfig:
    markdown: |
      <style>.rec{font-size:15px}.rec h3{margin:0 0 4px;font-weight:500}.rec .st{font-weight:700}.rec dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 0}.rec dt{opacity:.7}.rec dd{margin:0;font-weight:600;word-break:break-word}.rec .note{opacity:.7;margin-top:12px;font-size:13px}</style>
      <div class="rec">
      <h3>{{name}}</h3>
      <div><span class="st">{{status}}</span>: {{detail}}</div>
      <dl><dt>VPN endpoint</dt><dd>{{endpoint}}</dd><dt>Tunnel active</dt><dd>{{tunnel}}</dd><dt>Interface up</dt><dd>{{iface}}</dd><dt>VPN subnet</dt><dd>{{subnet}}</dd><dt>Default Allowed IPs</dt><dd>{{allowed}}</dd><dt>Default DNS</dt><dd>{{dns}}</dd><dt>Clients</dt><dd>{{connected}} connected, {{enabled}} enabled, {{total}} in all</dd><dt>wg-easy</dt><dd>{{version}}</dd><dt>Last report</dt><dd>{{updated}}</dd></dl>
      <div class="note">Create clients and download their configs in the Web UI on the right. Its Host and Port follow the IronFlock tunnel and must not be edited.</div>
      </div>
    data:
    - label: $str:name
      value:
        valueRef:
          tablename: gateway_registry
          column: device_name
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:status
      value:
        valueRef:
          tablename: gateway_registry
          column: status
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:detail
      value:
        valueRef:
          tablename: gateway_registry
          column: status_detail
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:endpoint
      value:
        valueRef:
          tablename: gateway_registry
          column: vpn_endpoint
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:tunnel
      value:
        valueRef:
          tablename: gateway_registry
          column: tunnel_active
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:iface
      value:
        valueRef:
          tablename: gateway_registry
          column: interface_up
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:subnet
      value:
        valueRef:
          tablename: gateway_registry
          column: ipv4_cidr
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:allowed
      value:
        valueRef:
          tablename: gateway_registry
          column: default_allowed_ips
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:dns
      value:
        valueRef:
          tablename: gateway_registry
          column: default_dns
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:connected
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: gateway_registry
          column: clients_connected
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:enabled
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: gateway_registry
          column: clients_enabled
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:total
      valueType: $str:number
      precision: $num:0
      value:
        valueRef:
          tablename: gateway_registry
          column: clients_total
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:version
      value:
        valueRef:
          tablename: gateway_registry
          column: wg_easy_version
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: device_id, operator: '=', value: '2', dataType: numeric, useRoute: true}
    - label: $str:updated
      valueType: $str:timestamp
      value:
        valueRef:
          tablename: gateway_registry
