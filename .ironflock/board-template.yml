              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
          styling:
            fontWeight: $str:600
        - header: $str:Status
          type: $str:state
          values:
            tableRef:
              tablename: gateways
              format:
                value: status
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
          styling:
            stateMap: $str:'OK', '#2e9e5b', 'WARNING', '#e0a526', 'PROBLEM', '#d9453d', 'SETUP_PENDING', '#3a7bd5', 'STARTING', '#9e9e9e'
            width: $str:130px
        - header: $str:Detail
          type: $str:string
          values:
            tableRef:
              tablename: gateways
              format:
                value: status_detail
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
        - header: $str:VPN endpoint
          type: $str:string
          values:
            tableRef:
              tablename: gateways
              format:
                value: vpn_endpoint
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
        - header: $str:Connected
          type: $str:number
          values:
            tableRef:
              tablename: gateways
              format:
                value: clients_connected
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
          styling:
            precision: $num:0
            width: $str:90px
        - header: $str:Clients
          type: $str:number
          values:
            tableRef:
              tablename: gateways
              format:
                value: clients_total
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
          styling:
            precision: $num:0
            width: $str:80px
        - header: $str:Updated
          type: $str:timestamp
          values:
            tableRef:
              tablename: gateways
              format:
                value: tsp
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
          styling:
            timestampFormat: $str:yyyy-MM-dd HH:mm
            width: $str:140px
      styling:
        headerFontSize: $str:14px
        cellPaddingVertical: $str:4px
        cellPaddingHorizontal: $str:8px
      subTitle: $str:Current state of every gateway running the app
  - layout_id: gateway-tabs
    package_name: widget-navbar
    version: 1.0.25
    chartconfig:
      title:
        valueRef:
          tablename: gateways
          column: devname
          queryParams:
            limit: 1
            filterAnd:
              - latest: true
                column: ''
                operator: '='
                value: ''
                dataType: boolean
              - column: device_key
                operator: '='
                value: '2'
                dataType: numeric
                useRoute: true
