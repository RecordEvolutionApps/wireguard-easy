# yaml-language-server: $schema=https://ironflock.com/schemas/board-template/v1.yml
# Board of the WireGuard VPN app. Pages: / (fleet overview), /gateways/ (list),
# /gateways/<device_key> (status + embedded wg-easy Web UI) with the tabs
# clients, traffic, checks and events, and /guide. All widgets bind to the
# tables in data-template.yml; the gateway pages filter by the device_key in
# the route. The board editor in IronFlock rewrites this file on save.
name: WireGuard_Easy
widgets:
  - layout_id: checks-table
    package_name: widget-table
    version: 1.2.0
    chartconfig:
      title: $str:Setup checklist
      columns:
        - header: $str:Check
          type: $str:string
          values:
            tableRef:
              tablename: checks
              format:
                value: label
              queryParams:
                limit: 50
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
          styling:
            fontWeight: $str:600
            width: $str:220px
        - header: $str:Result
          type: $str:state
          values:
            tableRef:
              tablename: checks
              format:
                value: result
              queryParams:
                limit: 50
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
          styling:
            stateMap: $str:'OK', '#2e9e5b', 'INFO', '#3a7bd5', 'WARNING', '#e0a526', 'PROBLEM', '#d9453d'
            width: $str:100px
        - header: $str:Observed
          type: $str:string
          values:
            tableRef:
              tablename: checks
              format:
                value: message
              queryParams:
                limit: 50
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
        - header: $str:How to fix
          type: $str:string
          values:
            tableRef:
              tablename: checks
              format:
                value: hint
              queryParams:
                limit: 50
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
        - header: $str:Since
          type: $str:timestamp
          values:
            tableRef:
              tablename: checks
              format:
                value: tsp
              queryParams:
                limit: 50
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
          styling:
            timestampFormat: $str:yyyy-MM-dd HH:mm
            width: $str:140px
      styling:
        headerFontSize: $str:14px
        cellPaddingVertical: $str:4px
        cellPaddingHorizontal: $str:8px
      subTitle: '$str:In setup order: fix the first PROBLEM first, each check assumes the ones above it pass'
  - layout_id: clients-table
    package_name: widget-table
    version: 1.2.0
    chartconfig:
      title: $str:Clients
      columns:
        - header: $str:Client
          type: $str:string
          values:
            tableRef:
              tablename: clients
              format:
                value: name
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
          styling:
            fontWeight: $str:600
        - header: $str:Status
          type: $str:state
          values:
            tableRef:
              tablename: clients
              format:
                value: status
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
          styling:
            stateMap: $str:'CONNECTED', '#2e9e5b', 'OFFLINE', '#9e9e9e', 'NEVER_CONNECTED', '#e0a526', 'DISABLED', '#9e9e9e', 'EXPIRED', '#d9453d', 'REMOVED', '#9e9e9e'
            width: $str:150px
        - header: $str:VPN address
          type: $str:string
          values:
            tableRef:
              tablename: clients
              format:
                value: ipv4
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
          styling:
            width: $str:130px
        - header: $str:Allowed IPs
          type: $str:string
          values:
            tableRef:
              tablename: clients
              format:
                value: allowed_ips
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
        - header: $str:Last handshake
          type: $str:timestamp
          values:
            tableRef:
              tablename: clients
              format:
                value: last_handshake
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
          styling:
            timestampFormat: $str:yyyy-MM-dd HH:mm
            width: $str:140px
        - header: $str:Enabled
          type: $str:boolean
          values:
            tableRef:
              tablename: clients
              format:
                value: enabled
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
          styling:
            width: $str:80px
        - header: $str:Expires
          type: $str:timestamp
          values:
            tableRef:
              tablename: clients
              format:
                value: expires_at
              queryParams:
                limit: 200
                filterAnd:
                  - latest: true
                    column: ''
                    operator: '='
                    value: ''
                    dataType: boolean
                  - column: device_key
                    operator: '='
                    value: '2'
                    dataType: numeric
                    useRoute: true
                  - combinator: OR
                    filters:
                      - column: deleted
                        operator: IS NULL
                        dataType: boolean
                      - column: deleted
                        operator: '='
                        value: false
                        dataType: boolean
          styling:
            timestampFormat: $str:yyyy-MM-dd
            width: $str:110px
      styling:
        headerFontSize: $str:14px
        cellPaddingVertical: $str:4px
        cellPaddingHorizontal: $str:8px
      subTitle: $str:CONNECTED = handshake within 3 minutes. Manage clients in the Web UI on the gateway page.
  - layout_id: events-table
    package_name: widget-table
    version: 1.2.0
    chartconfig:
      title: $str:Recent events
      columns:
        - header: $str:Time
          type: $str:timestamp
          values:
            tableRef:
              tablename: events
              format:
                value: tsp
              queryParams:
                limit: 40
          styling:
            timestampFormat: $str:yyyy-MM-dd HH:mm
            width: $str:140px
        - header: $str:Gateway
          type: $str:string
          values:
            tableRef:
              tablename: events
              format:
                value: devname
              queryParams:
                limit: 40
        - header: $str:Level
          type: $str:state
          values:
            tableRef:
              tablename: events
              format:
                value: level
              queryParams:
                limit: 40
          styling:
            stateMap: $str:'info', '#3a7bd5', 'warning', '#e0a526', 'error', '#d9453d'
            width: $str:90px
        - header: $str:Message
          type: $str:string
          values:
            tableRef:
              tablename: events
              format:
                value: message
              queryParams:
                limit: 40
      styling:
        headerFontSize: $str:14px
        cellPaddingVertical: $str:4px
        cellPaddingHorizontal: $str:8px
      subTitle: $str:Endpoint changes, repairs, clients connecting (oldest first)
