    - label: $str:name
      value:
        valueRef:
          tablename: vpn_clients
          column: name
          queryParams:
            limit: 1
            filterAnd:
            - {latest: true, column: '', operator: '=', value: '', dataType: boolean}
            - {column: client_key, operator: '=', value: '2', dataType: string, useRoute: true}
