  version: 1.1.1
  chartconfig:
    markdown: |
      ### Remove this gateway

      Every device that runs the app adds itself to the gateway list. A device cannot tell being offline from being gone, so a gateway that was replaced or scrapped stays listed until you remove it here. Its traffic and events are kept, and its clients stay under **Client stats** as offline: clients are deleted only in a gateway's Web UI.

