- layout_id: guide-md
  package_name: widget-markdown
  version: 1.1.1
  chartconfig:
    markdown: |
      # WireGuard VPN: setup and diagnosis guide

      This app packages the open-source [wg-easy](https://github.com/wg-easy/wg-easy) WireGuard server for IronFlock gateways. Connect your laptop or phone with the WireGuard app and reach the PLCs, HMIs and servers on the network behind a gateway, as if you were on site. The IronFlock AI assistant knows everything on this page in more depth: ask it to diagnose a gateway or a client, or how to reach a machine.

      ## How to get going

      1. Open the gateway under **Gateways**. Its page embeds the admin Web UI; log in with the Admin Username and Admin Password from the app parameters and change the password.
      2. Create a client with **+**, download its config or scan the QR code on the phone, activate the tunnel.
      3. Watch the client turn **CONNECTED** on the gateway's **Clients** tab, or under **Client stats**.

      ## Three places, three jobs

      | Place | What you do there |
      | - | - |
      | App parameters (device or group settings) | First-boot settings: admin login, DNS, first default Allowed IPs, VPN subnet |
      | wg-easy Web UI (the gateway's page on this board) | Clients: create, download configs, enable, expire, delete; interface settings |
      | This board | Status of every gateway, setup checklist, client connection state, traffic, events; the default Allowed IPs for new clients (the gateway's **Settings** tab); removing a gateway that is gone |

      ## First login

      On the first start the admin account is created from the **Admin Username** / **Admin Password** parameters (password at least 12 characters, or the first login fails). Change the password right after the first login; the parameter cannot change it afterwards.

      ## Options

      All parameters are applied on the first start only (while the database is still empty); change them afterwards in the Web UI. The default Allowed IPs for new clients is changed on the gateway's **Settings** tab on this board, or in the Web UI; the last change wins.

      | Parameter | Default | Description |
      | - | - | - |
      | Admin Username | `admin` | Initial admin username (min. 2 characters). |
      | Admin Password | `wireguard1234` | Initial admin password (min. 12 characters). Change it after the first login. |
      | DNS Server clients will use | `1.1.1.1` | DNS server(s) handed to clients, comma-separated. |
      | Allowed IPs clients will use | `0.0.0.0/0, ::/0` | Allowed IPs for new clients, comma-separated (first start; later on the Settings tab). |
      | VPN IPv4 subnet | `10.8.0.0/24` | Subnet of the VPN; change it only when your network already uses 10.8.0.x. |
      | VPN IPv6 subnet | `fdcc:ad94:bacf:61a4::cafe:0/112` | IPv6 subnet of the VPN (unused while IPv6 is disabled). |
      | Disable IPv6 | `true` | Disable IPv6 support on the server. |
      | Allow insecure HTTP access | `false` | Allow login over plain HTTP (LAN access without the tunnel). |

      ## Reach a PLC while keeping normal internet (split tunnel)

      A client's **Allowed IPs** (Web UI, client settings) decide what the laptop sends through the VPN. `0.0.0.0/0, ::/0` is a full tunnel: everything, including web browsing, goes through the plant. For a split tunnel set the VPN subnet plus the machines, e.g. `10.8.0.0/24, 192.168.0.123/32` for one PLC or `10.8.0.0/24, 192.168.0.0/24` for the whole machine network. Then **re-download the client config**; the setting is baked into it. To give every new client of a gateway the same split tunnel, set it as the default on the gateway's **Settings** tab.

      * Prefer `/32` entries per machine: if your office network is also 192.168.0.x, a `/24` entry hijacks your local traffic.
      * Connect to the PLC by **IP address**. TIA Portal's "Accessible devices" and Codesys scans use broadcasts that do not cross a routed VPN.
      * No change on the PLC: VPN traffic is masqueraded to the gateway's own LAN address. If the gateway's LAN interface is not `eth0`, change the interface device in the Web UI.

      ## When something does not work

      1. Open the gateway's **Checks** tab. Checks are ordered as a setup walk-through: fix the first PROBLEM first, then the WARNINGs.
      2. **No handshake?** Check the tunnel is active (Checks), that the client's config carries the current endpoint (Events: `endpoint_changed` means re-download), and that the client's network allows outbound UDP (test from a mobile hotspot).
      3. **Connected but nothing reachable?** Ping the gateway's VPN address (`10.8.0.1`); if that fails the client's Allowed IPs lack the VPN subnet. If a machine fails, its address is not in the Allowed IPs, or the gateway cannot route to it.
      4. **Lost clients after a restart?** The check *Database persists on /data* must be OK.
      5. **A saved default Allowed IPs did not apply?** The gateway's Events show `allowed_ips_applied` or `settings_rejected` with the reason.
      6. Ask the AI assistant: *"Diagnose gateway X"*, *"Why does client Y not connect?"*, *"Will client Y reach 192.168.0.123?"*.

      ## Requirements

      A Linux edge device (amd64 or arm64) with a kernel that supports WireGuard. wg-easy v15 does not support 32-bit ARM.

      Grant the app's **privileged access** when you install or update it: creating the WireGuard interface and forwarding VPN traffic need network administration rights. Without it the app exits at start with `RTNETLINK answers: Operation not permitted`.
    data: []
    verticalScroll: $bool:true
