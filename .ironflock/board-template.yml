  - layout_id: home-intro
    package_name: widget-markdown
    version: 1.0.17
    chartconfig:
      markdown: |
        ## Secure remote access to your machines

        Each gateway runs a WireGuard VPN server. Connect your laptop or phone with the WireGuard app and reach the PLCs, HMIs and servers on the network behind the gateway, as if you were on site.

        **How to get going**

        1. Pick a gateway in **Gateways**. Its page embeds the admin Web UI; log in with the Admin Username and Admin Password from the app parameters and change the password.
        2. Create a client with **+**, download its config or scan the QR code on the phone, activate the tunnel.
        3. Watch the client turn **CONNECTED** on the gateway's **Clients** tab.

        **Something not working?** Open the gateway's **Checks** tab: every check says what it found and how to fix it, in setup order. Or ask the IronFlock AI assistant, for example *"Why can't my laptop reach 192.168.0.123 through gateway Line-1?"*. It runs the same checks, reads the logs and knows the guides.

        Read the **Guide** for split tunnels (reach a PLC while keeping your normal internet), parameters and troubleshooting.
      data: []
      verticalScroll: $bool:true
