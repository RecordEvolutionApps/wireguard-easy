    package_name: widget-sidenav
    version: 1.0.25
    chartconfig:
      title: $str:Gateways
      route: $str:/gateways/
      navItems:
        tableRef:
          tablename: gateways
          format:
            label: devname
            iconName: $str:router
            route: device_key
          queryParams:
            limit: 200
            filterAnd:
              - latest: true
                column: ''
                operator: '='
                value: ''
                dataType: boolean
